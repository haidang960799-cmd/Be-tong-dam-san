
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự Toán Bê Tông</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            @page { margin: 15mm; }
        }
    </style>
</head>
<body class="bg-[#F4F7F9]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const PlusIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );

        const TrashIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
        );

        const LayersIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-500"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 12 12 17 22 12"></polyline><polyline points="2 17 12 22 22 17"></polyline></svg>
        );

        const BoxIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-orange-500"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        );

        const ColumnIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-500"><path d="M8 2v20"></path><path d="M16 2v20"></path><rect x="4" y="2" width="16" height="4" rx="1"></rect><rect x="4" y="18" width="16" height="4" rx="1"></rect></svg>
        );

        const MinusSquareIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-red-500"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        );

        const SettingsIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-slate-500"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        );

        const CalculatorIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-600"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="14.01"></line><line x1="16" y1="18" x2="16" y2="18.01"></line><line x1="12" y1="14" x2="12" y2="14.01"></line><line x1="12" y1="18" x2="12" y2="18.01"></line><line x1="8" y1="14" x2="8" y2="14.01"></line><line x1="8" y1="18" x2="8" y2="18.01"></line></svg>
        );

        const PrinterIcon = () => (
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        );

        const InputField = ({ label, value, onChange, placeholder = "0.0", min = "0" }) => (
          <div className="flex flex-col">
            <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 ml-1">{label}</label>
            <input
              type="number"
              value={value}
              onChange={onChange}
              placeholder={placeholder}
              min={min} 
              step="0.01"
              className="w-full h-12 rounded-xl border-slate-200 border bg-white px-3 text-sm focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all font-medium text-slate-800 shadow-sm"
            />
          </div>
        );

        function ConcreteCalculator() {
          const [projectName, setProjectName] = useState('');

          const [floors, setFloors] = useState([
            { id: 1, name: 'Sàn S1', length: '', width: '', thickness: '' }
          ]);

          const [beams, setBeams] = useState([
            { id: 1, name: 'Dầm D1', length: '', width: '', height: '', qty: 1 }
          ]);

          const [columns, setColumns] = useState([
            { id: 1, name: 'Đầu cột C1', length: '', width: '', height: '', qty: 1 }
          ]);

          const [deductions, setDeductions] = useState([
            { id: 1, name: 'Trừ lỗ thông tầng', length: '', width: '', height: '', qty: 1 }
          ]);

          const [settings, setSettings] = useState({
            wasteFactor: 2.5
          });

          // Các hàm xử lý Thêm/Xóa/Sửa dữ liệu
          const handleFloorChange = (id, field, value) => {
            setFloors(prev => prev.map(floor => floor.id === id ? { ...floor, [field]: value } : floor));
          };
          const addFloor = () => {
            const newId = floors.length > 0 ? Math.max(...floors.map(f => f.id)) + 1 : 1;
            setFloors(prev => [...prev, { id: newId, name: `Sàn S${newId}`, length: '', width: '', thickness: '' }]);
          };
          const removeFloor = (id) => setFloors(prev => prev.filter(floor => floor.id !== id));

          const handleBeamChange = (id, field, value) => {
            setBeams(prev => prev.map(beam => beam.id === id ? { ...beam, [field]: value } : beam));
          };
          const addBeam = () => {
            const newId = beams.length > 0 ? Math.max(...beams.map(b => b.id)) + 1 : 1;
            setBeams(prev => [...prev, { id: newId, name: `Dầm D${newId}`, length: '', width: '', height: '', qty: 1 }]);
          };
          const removeBeam = (id) => setBeams(prev => prev.filter(beam => beam.id !== id));

          const handleColumnChange = (id, field, value) => {
            setColumns(prev => prev.map(col => col.id === id ? { ...col, [field]: value } : col));
          };
          const addColumn = () => {
            const newId = columns.length > 0 ? Math.max(...columns.map(c => c.id)) + 1 : 1;
            setColumns(prev => [...prev, { id: newId, name: `Đầu cột C${newId}`, length: '', width: '', height: '', qty: 1 }]);
          };
          const removeColumn = (id) => setColumns(prev => prev.filter(col => col.id !== id));

          const handleDeductionChange = (id, field, value) => {
            setDeductions(prev => prev.map(deduct => deduct.id === id ? { ...deduct, [field]: value } : deduct));
          };
          const addDeduction = () => {
            const newId = deductions.length > 0 ? Math.max(...deductions.map(d => d.id)) + 1 : 1;
            setDeductions(prev => [...prev, { id: newId, name: `Trừ cấu kiện ${newId}`, length: '', width: '', height: '', qty: 1 }]);
          };
          const removeDeduction = (id) => setDeductions(prev => prev.filter(d => d.id !== id));

          const results = useMemo(() => {
            let floorVolume = 0;
            const floorDetails = floors.map(floor => {
              const l = parseFloat(floor.length) || 0;
              const w = parseFloat(floor.width) || 0;
              const t = parseFloat(floor.thickness) || 0;
              const vol = l * w * t;
              floorVolume += vol;
              return { ...floor, calculatedVolume: vol };
            });

            let beamsVolume = 0;
            const beamDetails = beams.map(beam => {
              const l = parseFloat(beam.length) || 0;
              const w = parseFloat(beam.width) || 0; 
              const h = parseFloat(beam.height) || 0; 
              const qty = parseInt(beam.qty) || 0;
              const vol = l * w * h * qty;
              beamsVolume += vol;
              return { ...beam, calculatedVolume: vol };
            });

            let columnsVolume = 0;
            const columnDetails = columns.map(col => {
              const l = parseFloat(col.length) || 0;
              const w = parseFloat(col.width) || 0; 
              const h = parseFloat(col.height) || 0; 
              const qty = parseInt(col.qty) || 0;
              const vol = l * w * h * qty;
              columnsVolume += vol;
              return { ...col, calculatedVolume: vol };
            });

            let deductionsVolume = 0;
            const deductionDetails = deductions.map(deduct => {
              const l = parseFloat(deduct.length) || 0;
              const w = parseFloat(deduct.width) || 0; 
              const h = parseFloat(deduct.height) || 0; 
              const qty = parseInt(deduct.qty) || 0;
              const vol = l * w * h * qty;
              deductionsVolume += vol;
              return { ...deduct, calculatedVolume: vol };
            });

            const rawSubTotal = floorVolume + beamsVolume + columnsVolume;
            const subTotal = Math.max(0, rawSubTotal - deductionsVolume); 
            const waste = subTotal * ((parseFloat(settings.wasteFactor) || 0) / 100);
            const grandTotal = subTotal + waste;

            return {
              floorVolume, floorDetails,
              beamsVolume, beamDetails,
              columnsVolume, columnDetails,
              deductionsVolume, deductionDetails,
              rawSubTotal, subTotal, waste, grandTotal
            };
          }, [floors, beams, columns, deductions, settings]);

          return (
            <div className="min-h-screen pb-28 lg:pb-12 font-sans text-slate-800 selection:bg-blue-200 print:bg-white print:pb-0">
              
              {/* --- GIAO DIỆN ỨNG DỤNG TRÊN MÀN HÌNH --- */}
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 lg:pt-10 print:hidden">
                
                <header className="mb-6 lg:mb-10 flex flex-col md:flex-row md:items-start justify-between gap-5">
                  <div className="flex items-start gap-4">
                    <div className="w-16 h-16 bg-white rounded-2xl shadow-sm flex items-center justify-center border border-slate-100 shrink-0 mt-1">
                       <CalculatorIcon />
                    </div>
                    <div>
                      <h1 className="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Dự Toán Bê Tông</h1>
                      <input 
                         type="text" 
                         value={projectName}
                         onChange={(e) => setProjectName(e.target.value)}
                         placeholder="Nhập hạng mục công trình (tùy chọn)..."
                         className="mt-3 w-full md:w-[350px] h-11 rounded-xl border-slate-200 border bg-white px-3 text-sm focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all font-medium text-slate-700 shadow-sm"
                      />
                    </div>
                  </div>
                  <button 
                    onClick={() => window.print()}
                    className="w-full md:w-auto flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl text-sm font-bold transition-all shadow-md active:scale-95 whitespace-nowrap"
                  >
                    <PrinterIcon /> Xuất Báo Cáo PDF
                  </button>
                </header>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">
                  
                  {/* CỘT TRÁI: NHẬP LIỆU */}
                  <div className="lg:col-span-8 space-y-6">
                    
                    {/* Mục Sàn */}
                    <section className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                      <div className="bg-slate-50/50 border-b border-slate-100 p-4 md:px-6 flex justify-between items-center">
                        <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2.5">
                          <div className="p-1.5 bg-blue-100 rounded-lg"><LayersIcon /></div>
                          Thông số Sàn
                        </h2>
                        <button onClick={addFloor} className="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm">
                          <PlusIcon /> <span className="hidden sm:inline">Thêm sàn</span>
                        </button>
                      </div>
                      <div className="p-4 md:p-6">
                        {floors.length === 0 ? (
                          <div className="text-center py-10 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                            <p className="text-slate-400 font-medium">Chưa có sàn nào được thêm.</p>
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {floors.map((floor, index) => (
                              <div key={floor.id} className="relative bg-[#FAFCFF] border border-blue-100 rounded-2xl p-4 md:p-5 transition-shadow hover:shadow-md">
                                <div className="flex justify-between items-center mb-4">
                                  <input 
                                    type="text" 
                                    value={floor.name}
                                    onChange={(e) => handleFloorChange(floor.id, 'name', e.target.value)}
                                    className="font-bold text-slate-700 text-sm bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm outline-none focus:border-blue-500 hover:border-blue-300 w-44 md:w-56 transition-colors"
                                    placeholder="Tên sàn..."
                                  />
                                  <button onClick={() => removeFloor(floor.id)} className="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition-colors"><TrashIcon /></button>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
                                  <InputField label="Dài (m)" value={floor.length} onChange={(e) => handleFloorChange(floor.id, 'length', e.target.value)} />
                                  <InputField label="Rộng (m)" value={floor.width} onChange={(e) => handleFloorChange(floor.id, 'width', e.target.value)} />
                                  <div className="col-span-2 md:col-span-1">
                                    <InputField label="Dày (m)" value={floor.thickness} onChange={(e) => handleFloorChange(floor.id, 'thickness', e.target.value)} />
                                  </div>
                                </div>
                                <div className="mt-4 pt-3 border-t border-blue-100/60 flex justify-between items-center">
                                  <span className="text-xs font-semibold text-slate-400 uppercase">Thể tích</span>
                                  <span className="font-bold text-blue-600 text-base">
                                    {results.floorDetails[index]?.calculatedVolume > 0 ? `${results.floorDetails[index].calculatedVolume.toFixed(3)} m³` : '0.000 m³'}
                                  </span>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </section>

                    {/* Mục Dầm */}
                    <section className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                      <div className="bg-slate-50/50 border-b border-slate-100 p-4 md:px-6 flex justify-between items-center">
                        <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2.5">
                          <div className="p-1.5 bg-orange-100 rounded-lg"><BoxIcon /></div>
                          Thông số Dầm
                        </h2>
                        <button onClick={addBeam} className="flex items-center gap-1.5 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm">
                          <PlusIcon /> <span className="hidden sm:inline">Thêm dầm</span>
                        </button>
                      </div>
                      <div className="p-4 md:p-6">
                        {beams.length === 0 ? (
                          <div className="text-center py-10 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                            <p className="text-slate-400 font-medium">Chưa có dầm nào được thêm.</p>
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {beams.map((beam, index) => (
                              <div key={beam.id} className="relative bg-[#FFFBF8] border border-orange-100 rounded-2xl p-4 md:p-5 transition-shadow hover:shadow-md">
                                <div className="flex justify-between items-center mb-4">
                                  <input 
                                    type="text" 
                                    value={beam.name}
                                    onChange={(e) => handleBeamChange(beam.id, 'name', e.target.value)}
                                    className="font-bold text-slate-700 text-sm bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm outline-none focus:border-orange-500 hover:border-orange-300 w-44 md:w-56 transition-colors"
                                    placeholder="Tên dầm..."
                                  />
                                  <button onClick={() => removeBeam(beam.id)} className="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition-colors"><TrashIcon /></button>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                                  <InputField label="Dài (m)" value={beam.length} onChange={(e) => handleBeamChange(beam.id, 'length', e.target.value)} />
                                  <InputField label="Rộng (m)" value={beam.width} onChange={(e) => handleBeamChange(beam.id, 'width', e.target.value)} />
                                  <InputField label="Cao (m)" value={beam.height} onChange={(e) => handleBeamChange(beam.id, 'height', e.target.value)} />
                                  <InputField label="Số lượng" value={beam.qty} onChange={(e) => handleBeamChange(beam.id, 'qty', e.target.value)} min="1" placeholder="1" />
                                </div>
                                <div className="mt-4 pt-3 border-t border-orange-100/60 flex justify-between items-center">
                                  <span className="text-xs font-semibold text-slate-400 uppercase">Thể tích</span>
                                  <span className="font-bold text-orange-600 text-base">
                                    {results.beamDetails[index]?.calculatedVolume > 0 ? `${results.beamDetails[index].calculatedVolume.toFixed(3)} m³` : '0.000 m³'}
                                  </span>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </section>

                    {/* Mục Đầu Cột */}
                    <section className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                      <div className="bg-slate-50/50 border-b border-slate-100 p-4 md:px-6 flex justify-between items-center">
                        <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2.5">
                          <div className="p-1.5 bg-emerald-100 rounded-lg"><ColumnIcon /></div>
                          Thông số Đầu cột
                        </h2>
                        <button onClick={addColumn} className="flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm">
                          <PlusIcon /> <span className="hidden sm:inline">Thêm cột</span>
                        </button>
                      </div>
                      <div className="p-4 md:p-6">
                        {columns.length === 0 ? (
                          <div className="text-center py-10 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                            <p className="text-slate-400 font-medium">Chưa có đầu cột nào được thêm.</p>
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {columns.map((col, index) => (
                              <div key={col.id} className="relative bg-[#F4FCF8] border border-emerald-100 rounded-2xl p-4 md:p-5 transition-shadow hover:shadow-md">
                                <div className="flex justify-between items-center mb-4">
                                  <input 
                                    type="text" 
                                    value={col.name}
                                    onChange={(e) => handleColumnChange(col.id, 'name', e.target.value)}
                                    className="font-bold text-slate-700 text-sm bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm outline-none focus:border-emerald-500 hover:border-emerald-300 w-44 md:w-56 transition-colors"
                                    placeholder="Tên đầu cột..."
                                  />
                                  <button onClick={() => removeColumn(col.id)} className="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition-colors"><TrashIcon /></button>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                                  <InputField label="Dài (m)" value={col.length} onChange={(e) => handleColumnChange(col.id, 'length', e.target.value)} />
                                  <InputField label="Rộng (m)" value={col.width} onChange={(e) => handleColumnChange(col.id, 'width', e.target.value)} />
                                  <InputField label="Cao (m)" value={col.height} onChange={(e) => handleColumnChange(col.id, 'height', e.target.value)} />
                                  <InputField label="Số lượng" value={col.qty} onChange={(e) => handleColumnChange(col.id, 'qty', e.target.value)} min="1" placeholder="1" />
                                </div>
                                <div className="mt-4 pt-3 border-t border-emerald-100/60 flex justify-between items-center">
                                  <span className="text-xs font-semibold text-slate-400 uppercase">Thể tích</span>
                                  <span className="font-bold text-emerald-600 text-base">
                                    {results.columnDetails[index]?.calculatedVolume > 0 ? `${results.columnDetails[index].calculatedVolume.toFixed(3)} m³` : '0.000 m³'}
                                  </span>
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </section>

                    {/* Mục Thể tích Giảm Trừ */}
